<div class="container">
  <header>
    <h1><i class="pi pi-lock"></i> Sistema de Login Seguro</h1>
    <p class="subtitle">Consideraciones para implementar autenticación en plataforma educativa con RA</p>
  </header>

  <div class="content">
    <div class="login-demo">
      <h2>Demo de Login</h2>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form" novalidate>

        <!-- Campo de Email -->
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <p-iconfield iconPosition="left">
            <p-inputicon styleClass="pi pi-envelope"></p-inputicon>
            <input
              pInputText
              type="email"
              id="email"
              formControlName="email"
              placeholder="usuario@ejemplo.com"
              autocomplete="email"
              [class.ng-invalid]="isFieldInvalid('email')"
              [class.ng-dirty]="loginForm.get('email')?.dirty"
              required
            />
          </p-iconfield>
          <small
            class="error-text"
            *ngIf="isFieldInvalid('email')"
            [@fadeInOut]
          >
            <i class="pi pi-exclamation-circle"></i>
            {{ getFieldError('email') }}
          </small>
        </div>

        <!-- Campo de Contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <p-password
            id="password"
            formControlName="password"
            placeholder="Ingresa tu contraseña"
            [toggleMask]="true"
            [feedback]="false"
            styleClass="w-full"
            inputStyleClass="w-full"
          ></p-password>
          <small class="error-text" *ngIf="isFieldInvalid('password')">
            <i class="pi pi-exclamation-circle"></i> {{ getFieldError('password') }}
          </small>
        </div>

        <!-- Opciones de Login -->
        <div class="login-options">
          <div class="remember-me">
            <p-checkbox
              formControlName="rememberMe"
              inputId="remember"
              label="Recordarme"
            ></p-checkbox>
          </div>
          <a href="#" class="forgot-password" (click)="$event.preventDefault(); forgotPassword()">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <!-- Botón Principal -->
        <p-button
          type="submit"
          label="Iniciar Sesión"
          styleClass="btn-login w-full"
          [disabled]="authService.isLoading() || loginForm.invalid"
          [loading]="authService.isLoading()"
        ></p-button>

        <!-- Mensaje de Error -->
        <div class="error-message" *ngIf="loginError()">
          <i class="pi pi-exclamation-triangle"></i>
          {{ loginError() }}
        </div>

        <!-- Social Login -->
        <div class="social-login">
          <div class="social-divider">
            <span>O inicia sesión con</span>
          </div>
          <div class="social-buttons">
            <p-button
              type="button"
              styleClass="btn-social google"
              (onClick)="socialLogin('google')"
              [text]="true"
              [rounded]="true"
            >
              <i class="pi pi-google"></i>
            </p-button>
            <p-button
              type="button"
              styleClass="btn-social microsoft"
              (onClick)="socialLogin('microsoft')"
              [text]="true"
              [rounded]="true"
            >
              <i class="pi pi-microsoft"></i>
            </p-button>
            <p-button
              type="button"
              styleClass="btn-social apple"
              (onClick)="socialLogin('apple')"
              [text]="true"
              [rounded]="true"
            >
              <i class="pi pi-apple"></i>
            </p-button>
          </div>
        </div>

        <!-- Registro -->
        <div class="register-section">
          <p>¿No tienes cuenta? <a href="#" (click)="$event.preventDefault(); goToRegister()">Regístrate aquí</a></p>
        </div>

      </form>
    </div>
  </div>
</div>
